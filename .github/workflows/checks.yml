name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      # CI fetches public test dependencies; runtime tools make no network requests.
      # Tests use synthetic local data, no model accounts, secrets or manuscript uploads.
      - run: python -m pip install -r requirements-test.txt
      - run: python -B scripts/security_check.py
      - name: Check source and Windows filesystem contracts
        run: >-
          python -B tests/run_rc1_suite.py --out "${{ runner.temp }}/source-suite.json"
          --tests test_project test_package test_secure_read test_workspace_admin
          test_local_config_recovery test_protected_folders test_release_security_gate
          test_rc1_candidate test_workbench_dependencies
      - run: python -B tests/check_documentation.py
      - name: Build the clean runtime package
        shell: bash
        run: python -B tools/build_plugin.py --out "$RUNNER_TEMP/novel-studio-package"
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-desktop.txt
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-import.txt'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-providers.txt'
      - run: python -m pip install -r requirements-test.txt
      - run: python -B tests/run_rc1_suite.py --out "${{ runner.temp }}/desktop-suite.json"
        env:
          QT_QPA_PLATFORM: offscreen
      # The independently audited Windows converter is not auto-downloaded by
      # CI. EPUB/RTF checks explicitly skip when it is absent; all eight formats
      # are exercised by the documented local bundle verification.
      # No model accounts, novelist files, screenshots or runtime logs are uploaded.

